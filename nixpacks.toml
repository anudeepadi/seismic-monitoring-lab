[phases.setup]
nixPkgs = ["nodejs_20", "python311"]

[phases.install]
cmds = [
    "cd frontend && npm install",
    "pip install -r requirements.txt"
]

[phases.build]
cmds = [
    "cd frontend && npm run build",
    "cp -r frontend/dist/* static/ 2>/dev/null || mkdir -p static && cp -r frontend/dist/* static/"
]

[start]
cmd = "python -m uvicorn src.api.main:app --host 0.0.0.0 --port ${PORT:-8000}"
