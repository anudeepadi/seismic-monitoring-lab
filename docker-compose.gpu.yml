version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: pinn-backend-gpu
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
      - ./logs:/app/logs
      - ./experiments:/app/experiments
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
      - CHECKPOINT_DIR=/app/checkpoints
      - DATA_DIR=/app/data
      - EXPERIMENTS_DIR=/app/experiments
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - pinn-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pinn-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - pinn-network

networks:
  pinn-network:
    driver: bridge

volumes:
  data:
  checkpoints:
  logs:
  experiments:
